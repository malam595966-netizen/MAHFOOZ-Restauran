{% extends 'base.html' %}{% block title %}Book a Table | MAHFOOZ{% endblock %}{% block content %}<section class="page-hero"><p class="eyebrow">MAKE IT A MOMENT</p><h1>Your table is <em>waiting.</em></h1><p>Tell us when you’re coming. We’ll take care of the rest.</p></section><section class="section booking-wrap"><form class="form-card booking-card" method="post"><div class="form-grid"><label>Full name *<input name="name" required maxlength="120"></label><label>Phone number *<input name="phone" required maxlength="20" pattern="[0-9+() -]{7,20}"></label><label>Email address<input type="email" name="email" maxlength="120"></label><label>Guests *<select name="guests" required>{% for n in range(1,13) %}<option value="{{ n }}" {% if n==2 %}selected{% endif %}>{{ n }} guest{% if n>1 %}s{% endif %}</option>{% endfor %}</select></label><label>Date *<input type="date" name="date" min="{{ today }}" required></label><label>Preferred time *<select name="time" required><option value="">Choose a time</option>{% for t in ['12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM','9:00 PM'] %}<option>{{ t }}</option>{% endfor %}</select></label><label>Seating preference<select name="seating"><option>Any</option><option>Indoor</option><option>Window seat</option><option>Family seating</option></select></label><label class="full-field">Special requests<textarea name="requests" rows="3" maxlength="1000" placeholder="Celebration, accessibility needs, or anything we should know…"></textarea></label></div><button class="btn">Request a Reservation ↗</button><small class="form-note">Your reservation is pending until our team confirms it.</small></form></section>{% endblock %}
