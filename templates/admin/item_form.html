{% extends 'base.html' %}{% block title %}{{ 'Edit' if item else 'Add' }} Dish | MAHFOOZ{% endblock %}{% block content %}<section class="admin-page"><div class="admin-head"><div><p class="eyebrow">KITCHEN CATALOGUE</p><h1>{{ 'Edit dish' if item else 'Add a dish' }}<em>.</em></h1></div><a class="btn btn-small" href="{{ url_for('admin_menu') }}">← Back to menu</a></div><form class="form-card admin-item-form" method="post"><div class="form-grid"><label>Dish name *<input name="name" required maxlength="150" value="{{ item.name if item else '' }}"></label><label>Category *<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if item and item.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>Price in ₹ *<input type="number" name="price" min="1" step="0.01" required value="{{ item.price if item else '' }}"></label><label>Preparation time<input name="preparation_time" value="{{ item.preparation_time if item else '20-30 min' }}"></label><label class="full-field">Description<textarea name="description" rows="3">{{ item.description if item else '' }}</textarea></label><label class="full-field">Image URL<input type="url" name="image_url" value="{{ item.image_url if item else '' }}" placeholder="https://…"></label><label>Food type<select name="is_veg"><option value="yes" {% if not item or item.is_veg %}selected{% endif %}>Vegetarian</option><option value="no" {% if item and not item.is_veg %}selected{% endif %}>Non-vegetarian</option></select></label><label>Available<select name="is_available"><option value="yes" {% if not item or item.is_available %}selected{% endif %}>Yes</option><option value="no" {% if item and not item.is_available %}selected{% endif %}>No</option></select></label><label>Feature on home page<select name="is_featured"><option value="yes" {% if item and item.is_featured %}selected{% endif %}>Yes</option><option value="no" {% if not item or not item.is_featured %}selected{% endif %}>No</option></select></label></div><button class="btn">Save dish ↗</button></form></section>{% endblock %}
